[project]
name = "rag_system"
version = "0.1.0"
description = "RAG system V0: unified ingestion pipeline (Markdown parser + simple chunker)"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_system"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
